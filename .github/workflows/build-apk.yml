name: Build Mitra APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mitra-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/mitra-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: mitra
        run: gradle testReleaseUnitTest assembleRelease --stacktrace
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { ls -R app/build/outputs/apk; exit 1; }
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK"
          $BT/aapt dump badging "$APK" | head -5
          cp "$APK" Mitra.apk
          rm -f "$RUNNER_TEMP/mitra-release.p12"
      - uses: actions/upload-artifact@v4
        with: { name: Mitra-APK, path: Mitra.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mitra-v4.1-build-${{ github.run_number }}
          name: Mitra v4.1 (build ${{ github.run_number }})
          body: "Mitra v4.1 (versionCode 8) — साफ़-सुथरा नया डिज़ाइन। ✨ होम स्क्रीन पर सिर्फ़ चैट और एक बड़ा 🎤 बटन; Live बात, बातचीत मोड, आवाज़, हमेशा सुनें और सेटिंग्स अब ऊपर ⋮ मेनू में। 📱 हर स्क्रीन साइज़ पर ठीक दिखता है — छोटे फ़ोन, बड़ा फ़ॉन्ट, लैंडस्केप और टैबलेट; सब स्क्रीनें स्क्रॉल होती हैं, कीबोर्ड या नेविगेशन बार के पीछे कुछ नहीं छिपता, बटन दबाने में आसान (48dp)। सारी सुविधाएँ पहले जैसी। Signed with the same key, installs as an update."
          files: Mitra.apk
