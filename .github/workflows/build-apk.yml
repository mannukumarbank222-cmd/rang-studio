name: Build Mitra APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mitra-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/mitra-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: mitra
        run: gradle testReleaseUnitTest assembleRelease --stacktrace
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { ls -R app/build/outputs/apk; exit 1; }
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK"
          $BT/aapt dump badging "$APK" | head -5
          cp "$APK" Mitra.apk
          rm -f "$RUNNER_TEMP/mitra-release.p12"
      - uses: actions/upload-artifact@v4
        with: { name: Mitra-APK, path: Mitra.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mitra-v4.0-build-${{ github.run_number }}
          name: Mitra v4.0 (build ${{ github.run_number }})
          body: "Mitra v4.0 (versionCode 7) — PhonePe Indus Appstore release. ✅ ज़्यादा काम: आवाज़ कम/ज़्यादा, साइलेंट/वाइब्रेट, Wi-Fi/ब्लूटूथ/ब्राइटनेस सेटिंग, बैटरी, रिमाइंडर, नोट कॉपी, UPI ऐप खोलना, सेल्फ़ी, नेविगेशन, तुरंत हिसाब, कोई भी ऐप नाम से (हिंदी नाम/ग़लत स्पेलिंग भी) और एक वाक्य में कई काम (‘सोनू को कॉल करो और फिर YouTube खोलो’)। 🌐 हर भाषा: भाषा अपने-आप पहचानकर उसी में जवाब, उसी भाषा में सुनना और बोलना। ⚡ तेज़: मुफ़्त AI समानांतर, कनेक्शन पहले से तैयार, जवाब वाक्य-दर-वाक्य। 👂 बेहतर सुनना: बोलते-बोलते शब्द दिखते हैं, आदेश पूरा होते ही तुरंत जवाब, ‘मित्र’ ग़लती से कम जागता है। 🔒 कम अनुमतियाँ, नई प्राइवेसी पॉलिसी। Signed with the same key, installs as an update."
          files: Mitra.apk
