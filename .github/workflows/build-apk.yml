name: Build Mitra APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mitra-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/mitra-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: mitra
        run: gradle testReleaseUnitTest assembleRelease --stacktrace
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { ls -R app/build/outputs/apk; exit 1; }
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK"
          $BT/aapt dump badging "$APK" | head -5
          cp "$APK" Mitra.apk
          rm -f "$RUNNER_TEMP/mitra-release.p12"
      - uses: actions/upload-artifact@v4
        with: { name: Mitra-APK, path: Mitra.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mitra-v3.1-build-${{ github.run_number }}
          name: Mitra v3.1 (build ${{ github.run_number }})
          body: "Mitra v3.1 - 🔇 बार-बार माइक/‘टुन-टुन’ बीप ठीक: ‘हमेशा सुनें’ अब सिर्फ़ ऑफ़लाइन मॉडल से चुपचाप सुनता है (Google mic का बार-बार चालू होना बंद), Google mic popup कभी नहीं खुलता, बोलते समय बीप की आवाज़ दबाई जाती है, कुछ न सुनाई दे तो 1s/3s रुककर 3 बार के बाद रुक जाता है। बैटरी बचत: स्क्रीन बंद पर सुनना रुकता है (सेटिंग्स में ‘स्क्रीन बंद पर भी सुनें’)। पहली बार सेटिंग्स › हमेशा सुनें › सेटअप में आवाज़ मॉडल (~44 MB) डाउनलोड करें। Signed with the same key, installs as an update."
          files: Mitra.apk
